name: Render Hadith Video (Remotion + FFmpeg)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      props:
        description: 'JSON props for video (optional)'
        required: false
        default: '{}'
      audio_url:
        description: 'Optional Google Drive / direct URL for audio.mp3'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: npm install

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Optional - Download audio from URL (if provided)
        if: ${{ inputs.audio_url!= '' }}
        run: |
          echo "Downloading audio from ${{ inputs.audio_url }}"
          curl -L -o audio.mp3 "${{ inputs.audio_url }}"
          curl -L -o public/audio.mp3 "${{ inputs.audio_url }}"

      - name: Render 4K 9:16 Video (2160x3840)
        run: |
          mkdir -p out
          npx remotion render Root.tsx HadithStory out/hadith-4k-9-16.mp4 --codec=h264 --crf=18 --width=2160 --height=3840 --concurrency=2 --image-format=jpeg --overwrite

      - name: Verify output with ffprobe
        run: |
          ls -lh out/
          ffprobe -v error -show_entries stream=width,height,duration,codec_name -of default=noprint_wrappers=1 out/hadith-4k-9-16.mp4

      - name: Upload 4K video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadith-video-4k-9-16
          path: out/hadith-4k-9-16.mp4
          retention-days: 14
