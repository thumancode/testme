name: Render Hadith Video (Remotion + FFmpeg)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Optional direct URL for audio.mp3 (Google Drive direct link)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache removed - package-lock.json not required

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Optional - Download audio from URL
        if: ${{ inputs.audio_url != '' }}
        run: |
          curl -L -o audio.mp3 "${{ inputs.audio_url }}"
          mkdir -p public
          cp audio.mp3 public/audio.mp3
          ls -lh audio.mp3

      - name: Render 4K 9:16 Video (2160x3840)
        run: |
          mkdir -p out
          npx remotion render Root.tsx HadithStory out/hadith-4k-9-16.mp4 --codec=h264 --crf=18 --width=2160 --height=3840 --concurrency=2 --image-format=jpeg --overwrite

      - name: Verify with ffprobe
        run: |
          ls -lh out/
          ffprobe -v error -show_entries stream=width,height,duration,codec_name -of default=noprint_wrappers=1 out/hadith-4k-9-16.mp4 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadith-video-4k-9-16
          path: out/hadith-4k-9-16.mp4
          retention-days: 14
          compression-level: 0
